server:
  servlet:
    context-path: /cliente-pet/api

spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5433/petdb?currentSchema=pet}
    username: ${DATASOURCE_USER:postgres}
    password: ${DATASOURCE_PASS:esmy1458}
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      poolName: SpringBootJPAHikariCP
      minimumIdle: 15
      maximumPoolSize: 50
      connectionTimeout: 30000
      idleTimeout: 30000
      maxLifetime: 1000000
springdoc:
  swagger-ui:
    path: /swagger-ui